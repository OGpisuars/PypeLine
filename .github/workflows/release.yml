name: Release builds

# Builds PypeLine for Windows, macOS and Linux on every push to main and
# publishes them together as the "latest" pre-release, so the newest build
# is always one download away:
# https://github.com/OGpisuars/PypeLine/releases/tag/latest

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only the newest push matters; cancel older builds still running.
concurrency:
  group: release-builds
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: PPL/pypeline
    shell: bash

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # The toolchain version comes from rust-toolchain.toml.
      - name: Install Rust
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: PPL/pypeline
          key: release

      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: |
          mkdir -p dist/PypeLine
          cp target/release/pypeline.exe dist/PypeLine/PypeLine.exe
          cp ../../LICENSE dist/PypeLine/LICENSE.txt
          cp ASSET_LICENSES.md dist/PypeLine/
          cp assets/fonts/*-OFL.txt dist/PypeLine/
          cd dist && 7z a -tzip PypeLine-windows.zip PypeLine > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: PPL/pypeline/dist/PypeLine-windows.zip

  macos:
    name: macOS (Apple Silicon + Intel)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup show
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: PPL/pypeline
          key: release

      - name: Build
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin

      # A universal PypeLine.app, so it runs on every Mac.
      - name: Package
        run: |
          app=dist/PypeLine.app/Contents
          mkdir -p "$app/MacOS" "$app/Resources"
          lipo -create -output "$app/MacOS/PypeLine" \
            target/aarch64-apple-darwin/release/pypeline \
            target/x86_64-apple-darwin/release/pypeline

          iconset=dist/PypeLine.iconset
          mkdir -p "$iconset"
          for size in 16 32 128 256 512; do
            sips -z $size $size assets/icon/pypeline.png --out "$iconset/icon_${size}x${size}.png" > /dev/null
            double=$((size * 2))
            sips -z $double $double assets/icon/pypeline.png --out "$iconset/icon_${size}x${size}@2x.png" > /dev/null
          done
          iconutil -c icns "$iconset" -o "$app/Resources/PypeLine.icns"

          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          cat > "$app/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>PypeLine</string>
            <key>CFBundleDisplayName</key><string>PypeLine</string>
            <key>CFBundleIdentifier</key><string>com.kilokilogames.pypeline</string>
            <key>CFBundleExecutable</key><string>PypeLine</string>
            <key>CFBundleIconFile</key><string>PypeLine</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${version}</string>
            <key>CFBundleVersion</key><string>${GITHUB_SHA::7}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST

          # Not notarized yet: sign ad hoc so Apple Silicon will run it.
          codesign --force --deep --sign - dist/PypeLine.app

          mkdir -p dist/PypeLine
          mv dist/PypeLine.app dist/PypeLine/
          cp ../../LICENSE dist/PypeLine/LICENSE.txt
          cp ASSET_LICENSES.md dist/PypeLine/
          cp assets/fonts/*-OFL.txt dist/PypeLine/
          cd dist && ditto -c -k --keepParent PypeLine PypeLine-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: PPL/pypeline/dist/PypeLine-macos.zip

  linux:
    name: Linux
    # The oldest supported Ubuntu, so the build runs on older distros too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - name: Install Rust
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: PPL/pypeline
          key: release

      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: |
          mkdir -p dist/PypeLine
          cp target/release/pypeline dist/PypeLine/pypeline
          cp ../../LICENSE dist/PypeLine/LICENSE.txt
          cp ASSET_LICENSES.md dist/PypeLine/
          cp assets/fonts/*-OFL.txt dist/PypeLine/
          cd dist && tar -czf PypeLine-linux.tar.gz PypeLine

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: PPL/pypeline/dist/PypeLine-linux.tar.gz

  publish:
    name: Publish the "latest" pre-release
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > notes.md <<'NOTES'
          Automatic build of the newest commit on main.

          | System | Download | How to start |
          |---|---|---|
          | Windows | `PypeLine-windows.zip` | Unzip, then run `PypeLine.exe`. If SmartScreen warns, click **More info > Run anyway**. |
          | macOS (Apple Silicon and Intel) | `PypeLine-macos.zip` | Unzip and move `PypeLine.app` to Applications. It is not notarized yet, so the first time: on macOS 15 and newer, open **System Settings > Privacy & Security** and click **Open Anyway**; on older versions, right-click it and choose **Open**. |
          | Linux (x86-64) | `PypeLine-linux.tar.gz` | Extract, then run `./pypeline`. Needs Vulkan and ALSA or PipeWire, which most desktops have. |

          Your scripts and saves are kept between versions.
          NOTES
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/* \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Latest build (${GITHUB_SHA::7})" \
            --notes-file notes.md
