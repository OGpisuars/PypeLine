[package]
name = "pypeline"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A cozy GBA-style factory game where your factory runs on real Python."

[dependencies]
bevy = "0.19.1"
bevy_egui = "0.42.0"
dirs = "7"
rustpython-vm = { version = "0.6.0", default-features = false, features = ["compiler"] }

# Fast iteration: optimize dependencies in debug builds, keep our code quick to compile.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# RustPython 0.6 bug: on Windows, rustpython-host_env always uses its internal
# `ctypes` helpers, which only exist with this feature. Turning it on here does
# NOT give scripts a ctypes module (rustpython-vm's `host_env` feature stays off).
[target.'cfg(windows)'.dependencies]
rustpython-host_env = { version = "=0.6.0", features = ["ctypes"] }
