[package]
name = "pypeline"
version = "0.1.0"
edition = "2024"
default-run = "pypeline"
license = "MIT"
description = "A cozy GBA-style factory game where your factory runs on real Python."

[dependencies]
bevy = { version = "0.19.1", features = ["wav"] }
bevy_egui = "0.42.0"
dirs = "7"
rustpython-vm = { version = "0.6.0", default-features = false, features = ["compiler"] }
# Pinned: 0.16.10 breaks rustpython-codegen 0.6 (see docs/DECISIONS.md).
ruff_text_size = { package = "rustpython-ruff_text_size", version = "=0.16.5" }
serde = { version = "1", features = ["derive"] }
ron = "0.12.2"
winit = { version = "0.30.13", default-features = false }

# Fast iteration: optimize dependencies in debug builds, keep our code quick to compile.
# Debug info is the biggest memory cost of a build, so dependencies get none and
# our code gets line numbers only (backtraces still show files and lines). This
# keeps builds usable on machines with little RAM.
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

# RustPython 0.6 bug: on Windows, rustpython-host_env always uses its internal
# `ctypes` helpers, which only exist with this feature. Turning it on here does
# NOT give scripts a ctypes module (rustpython-vm's `host_env` feature stays off).
[target.'cfg(windows)'.dependencies]
rustpython-host_env = { version = "=0.6.0", features = ["ctypes"] }

[build-dependencies]
embed-resource = "3"
image = { version = "0.25.10", default-features = false, features = ["png"] }
